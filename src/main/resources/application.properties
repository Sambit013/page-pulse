spring.application.name=page-pulse

# Render (and most free-tier hosts) inject PORT as an env var.
# Default to 8080 for local dev.
server.port=${PORT:8080}

# Keep default error handling minimal - GlobalExceptionHandler owns
# the real error contract, this is just a fallback.
server.error.include-message=never
server.error.include-stacktrace=never
